<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Administrador - Bar Aurita</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <!-- Barra de Menú -->
    <nav class="bg-gray-800 p-4">
        <ul class="flex justify-center space-x-4 text-white font-semibold">
            <li><a href="index.html" class="hover:text-yellow-400">Inicio</a></li>
            <li><a href="productos.html" class="hover:text-yellow-400">Productos</a></li>
            <li><a href="ofertas.html" class="hover:text-yellow-400">Ofertas</a></li>
            <li><a href="blog.html" class="hover:text-yellow-400">Reseñas</a></li>
            <li><a href="contacto.html" class="hover:text-yellow-400">Contacto</a></li>
            <li><a href="login.html" class="hover:text-yellow-400">Login</a></li>
            <li><a href="carrito.html" class="hover:text-yellow-400">Carrito</a></li>
            <li><a href="perfil.html" class="hover:text-yellow-400">Perfil</a></li>
        </ul>
    </nav>

    <!-- Encabezado del Perfil -->
    <header class="bg-gray-800 h-64 text-center py-10">
        <div class="flex flex-col justify-center items-center text-white h-full">
            <h1 class="text-4xl font-bold">Perfil de Administrador</h1>
            <p class="text-xl mt-4">Información del Usuario</p>
        </div>
    </header>

    <!-- Sección del Usuario -->
    <section class="py-12 bg-white">
        <div class="container mx-auto flex items-center">
            <div class="w-1/3">
                <img id="user-foto" src="" alt="Foto de Usuario" class="w-32 h-32 object-cover rounded-full border-2 border-gray-300">
            </div>
            <div class="ml-6">
                <h2 class="text-2xl font-bold" id="user-nombre"></h2>
                <p class="text-lg text-gray-700" id="user-apellido"></p>
                <p class="text-gray-600" id="user-cedula"></p>
                <p class="text-gray-600" id="user-correo"></p>
                <p class="text-gray-600" id="user-rol"></p>
                <!-- Botón de Cerrar Sesión -->
                <button id="logout-btn"class="mt-4 bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded">
                    Cerrar Sesión
                </button>
            </div>
        </div>
    </section>

    <!-- Sección de Productos -->
    <section class="py-12 bg-gray-50">
        <div class="container mx-auto">
            <h2 class="text-3xl font-bold text-center mb-6">Lista de Productos</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white border border-gray-200">
                    <thead>
                        <tr class="bg-gray-800 text-white">
                            <th class="py-2 px-4 border-b">ID</th>
                            <th class="py-2 px-4 border-b">Nombre</th>
                            <th class="py-2 px-4 border-b">Descripción</th>
                            <th class="py-2 px-4 border-b">Imagen</th>
                            <th class="py-2 px-4 border-b">Precio</th>
                            <th class="py-2 px-4 border-b">Estado</th>
                            <th class="py-2 px-4 border-b">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="productos">
                        <!-- Los productos se cargarán aquí -->
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- Pie de página -->
    <footer class="bg-gray-800 text-white py-4 text-center">
        <p>&copy; 2024 Bar Aurita. Todos los derechos reservados.</p>
    </footer>

    <!-- Script para obtener y mostrar el usuario y productos -->
    <script>
        async function cargarUsuario() {
            try {
                const response = await fetch('http://localhost:3000/usuarios'); // Llama al endpoint para obtener el usuario
                if (!response.ok) {
                    throw new Error('Error al cargar el usuario');
                }
                const usuario = await response.json();
                const user = usuario[0]; // Suponemos que solo hay un usuario

                document.getElementById('user-foto').src = user.user_foto_url; // Asegúrate de que la propiedad se llama correctamente
                document.getElementById('user-nombre').textContent = user.user_nombre;
                document.getElementById('user-apellido').textContent = user.user_apellido;
                document.getElementById('user-cedula').textContent = `Cédula: ${user.user_cedula}`;
                document.getElementById('user-correo').textContent = `Correo: ${user.user_correo}`;
                document.getElementById('user-rol').textContent = `Rol: ${user.user_rol}`;
            } catch (error) {
                console.error('Error al obtener el usuario:', error);
                alert('Error al cargar los datos del usuario. Por favor, inténtalo de nuevo más tarde.');
            }
        }

        async function cargarProductos() {
            try {
                const response = await fetch('http://localhost:3000/productos'); // Llama al endpoint para obtener productos
                if (!response.ok) {
                    throw new Error('Error al cargar los productos');
                }
                const productos = await response.json();
                const productosContainer = document.getElementById('productos');

                productos.forEach(producto => {
                    const productoRow = document.createElement('tr');
                    productoRow.innerHTML = `
                        <td class="py-2 px-4 border-b">${producto.pro_id}</td>
                        <td class="py-2 px-4 border-b">${producto.pro_nombre}</td>
                        <td class="py-2 px-4 border-b">${producto.pro_descripcion}</td>
                        <td class="py-2 px-4 border-b">
                            <img src="${producto.pro_ruta}" alt="${producto.pro_nombre}" class="w-16 h-16 object-cover rounded">
                        </td>
                        <td class="py-2 px-4 border-b">$${producto.pro_precio}</td>
                        <td class="py-2 px-4 border-b">${producto.pro_estado ? 'Activo' : 'Inactivo'}</td>
                        <td class="py-2 px-4 border-b">
                            <button class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-1 px-2 rounded">Editar</button>
                            <button class="bg-red-500 hover:bg-red-600 text-white font-bold py-1 px-2 rounded">Eliminar</button>
                        </td>
                    `;
                    productosContainer.appendChild(productoRow);
                });
            } catch (error) {
                console.error('Error al obtener los productos:', error);
                alert('Error al cargar los productos. Por favor, inténtalo de nuevo más tarde.');
            }
        }

        // Cargar usuario y productos al cargar la página
        window.onload = () => {
            cargarUsuario();
            cargarProductos();
        };
    </script>
    <script>
        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        });

    </script>
</body>
</html>
